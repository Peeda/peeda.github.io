<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under construction</title>
  <style>
    :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #666; --accent: #0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --accent: #58a6ff; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { color: var(--muted); margin-bottom: 1.5rem; }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      border: 1.5px solid var(--accent);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
    }
    a:hover { background: var(--accent); color: var(--bg); }
  </style>
</head>
<body>
  <main>
    <h1>🚧 Work in progress</h1>
    <p>This site is under construction. Check back soon!</p>
    <a href="https://github.com/peeda">View my GitHub →</a>
  </main>
</body>
</html>
